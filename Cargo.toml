[package]
edition = "2021"
name = "groceries-bmesh-ui"
version = "0.1.0"

[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dependencies.leptos]
version = "0.8"
features = ["csr"]

[dependencies.serde]
version = "1"
features = ["derive"]

[workspace]
members = [
    "groceries-bmesh-core",
    "src-tauri",
]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
